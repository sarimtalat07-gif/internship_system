{% extends 'portal/base.html' %}

{% block content %}
<h1>Apply: {{ internship.title }}</h1>
<p class="text-muted">{{ internship.company.name }}</p>
<hr>

<!-- enctype is REQUIRED for file upload forms -->
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Submit Application</button>
    <a class="btn btn-secondary" href="{% url 'internship_detail' internship.id %}">Cancel</a>
</form>
{% endblock %}
